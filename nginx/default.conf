# Serves the built site under /portfolio/ (the droplet's front nginx proxies /portfolio to this container).
# Replaces the image's stock /etc/nginx/conf.d/default.conf.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Relative Location headers (/portfolio/), so redirects keep the scheme and host the visitor used.
    absolute_redirect off;

    # Compress text responses (HTML is always included). The front nginx talks HTTP/1.0 to upstreams
    # by default and may add a Via header, hence gzip_http_version and gzip_proxied.
    gzip on;
    gzip_http_version 1.0;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # Built files have a content hash in their names and never change: browsers keep them for a year.
    location /portfolio/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The page and the files from public/ (favicon, manifest, social image) keep their names: revalidate every time.
    location /portfolio/ {
        add_header Cache-Control "no-cache";
        index index.html;
        try_files $uri $uri/ =404;
    }
}
