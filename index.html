<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Google Analytics (gtag.js), the standard snippet; sends the page view.
         It also proves ownership of the site in Google Search Console: removing it loses the verification. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SLG56091CZ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-SLG56091CZ');
    </script>

    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Vitaly Kvashin, backend developer (C#/.NET) with over 12 years of experience: payment services and provider integrations at MAJORITY, distributed systems, observability and AI-assisted development."
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Files in public/ are referenced from the root; the build prefixes them with the base path (/portfolio/). -->
    <title>Vitaly Kvashin · Backend Developer (C# / .NET)</title>

    <!-- The same page is served at skuill.com/portfolio/ and skuill.github.io/portfolio/: search engines index skuill.com. -->
    <link rel="canonical" href="https://skuill.com/portfolio/" />
    <!-- Link previews (LinkedIn, Telegram, Slack, X). Absolute URLs: not every crawler resolves relative ones.
         The picture is built by branding/social-image/social_image.py. -->
    <meta property="og:type" content="website" />
    <!-- Shown above the title in Telegram and Slack; without it they take the domain ("Skuill"). -->
    <meta property="og:site_name" content="Vitaly Kvashin" />
    <meta property="og:url" content="https://skuill.com/portfolio/" />
    <meta property="og:title" content="Vitaly Kvashin · Backend Developer (C# / .NET)" />
    <meta
      property="og:description"
      content="Vitaly Kvashin, backend developer (C#/.NET) with over 12 years of experience: payment services and provider integrations at MAJORITY, distributed systems, observability and AI-assisted development."
    />
    <meta property="og:image" content="https://skuill.com/portfolio/social-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vitaly Kvashin, Backend Developer (C# / .NET)" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Who the page is about, for search engines (schema.org Person). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Vitaly Kvashin",
        "jobTitle": "Backend Developer (C# / .NET)",
        "url": "https://skuill.com/portfolio/",
        "sameAs": ["https://github.com/skuill", "https://www.linkedin.com/in/vitaly-kvashin/"]
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
