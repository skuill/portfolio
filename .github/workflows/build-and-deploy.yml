# Every push and pull request to master: install, lint, test, build (the "build" check is required to merge).
# A published release also deploys to GitHub Pages and pushes the image to Docker Hub; the droplet gets it by the
# manual Deploy workflow (deploy.yml).

name: Build and Deploy to Github Pages and DockerHub

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  release:
    types: [published]

permissions:
  contents: read

# Releases deploy one at a time, in the order they were published; a new push to a pull request cancels its older run.
concurrency:
  group: ${{ github.event_name == 'release' && 'release' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - run: npm run build

  # Pull requests: the Docker image as the droplet runs it. Checks its nginx (compression, caching)
  # and measures the page with Lighthouse against the thresholds in lighthouserc.json.
  lighthouse:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the site container
        run: |
          docker build -t portfolio:ci .
          docker run -d --name portfolio -p 8080:80 portfolio:ci
      - name: Check the container nginx
        run: bash scripts/check-container.sh http://localhost:8080
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun
      - name: Lighthouse summary
        if: always()
        run: node scripts/lighthouse-summary.js >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: .lighthouseci/reports/

  publish-github-pages:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # runs only when release with a new tag
    permissions:
      contents: write # the deploy action pushes to the gh-pages branch
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install Packages
        run: npm ci
      - name: Build
        run: npm run build
      - name: Deploy to GH pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist

  publish-docker-image:
    needs: [build, publish-github-pages]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # runs only when release with a new tag
    steps:
    - uses: actions/checkout@v7
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract release version
      id: get_version
      run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

    - name: Build and push Docker image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/portfolio:${{ env.RELEASE_VERSION }} .
        docker tag ${{ secrets.DOCKERHUB_USERNAME }}/portfolio:${{ env.RELEASE_VERSION }} ${{ secrets.DOCKERHUB_USERNAME }}/portfolio:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/portfolio:${{ env.RELEASE_VERSION }}
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/portfolio:latest
